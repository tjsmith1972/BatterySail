[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batterysail"
version = "0.1.0"
description = "Battery charge limiting with sailing mode for Intel MacBooks, via the SMC (BCLM)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
batterysail = "batterysail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
